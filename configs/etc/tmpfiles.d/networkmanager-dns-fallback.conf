# Prime /run/NetworkManager/resolv.conf with a static fallback at boot.
#
# /etc/resolv.conf -> /run/NetworkManager/resolv.conf (tmpfs). On boot
# /run is empty; until NetworkManager finishes writing the file, DNS
# resolution has nothing to point at. If NM never starts, or stops mid-
# session, that "nothing" state is the failure.
#
# The 'f' verb creates the file IFF it doesn't exist. NM still owns the
# file once it's running and will rewrite it on every connection change.
# This primer only fills the early-boot gap.
#
# Encoding: \x20 = space, \n = newline (systemd-tmpfiles syntax).

d /run/NetworkManager 0755 root root -
f /run/NetworkManager/resolv.conf 0644 root root - nameserver\x201.1.1.1\nnameserver\x209.9.9.9\n
