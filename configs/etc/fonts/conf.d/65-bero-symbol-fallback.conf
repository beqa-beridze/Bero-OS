<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!--
    Bero-OS: symbol + emoji fallback chain.

    Red Hat Mono has no glyphs for dingbats, geometric shapes, misc
    symbols, or emoji. Without explicit fallbacks, fontconfig picks
    "least bad" (Luxi Sans) which also has no glyph, and the terminal
    renders empty boxes (tofu) for every Claude Code status marker,
    every emoji, etc.

    These rules append Noto Sans Symbols 2 (mono symbols) and Noto
    Color Emoji (color emoji) to the family list of every common UI
    font, so the renderer tries them when the primary font is missing
    a glyph.
  -->

  <!-- Red Hat Mono (terminal, prompts, bero CLI) -->
  <match target="pattern">
    <test name="family"><string>Red Hat Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Symbols 2</string>
      <string>Noto Sans Mono</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- Generic monospace (mousepad, GTK monospace contexts) -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Symbols 2</string>
      <string>Noto Sans Mono</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- Generic sans-serif (panel labels, GTK UI text) -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Symbols 2</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- Generic serif -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Symbols 2</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
