# Bero-OS Workshop config for Kitty
# Mirrors the xfce4-terminal palette + Red Hat Mono font

# --- Fonts ---
font_family       Red Hat Mono Medium
bold_font         Red Hat Mono SemiBold
italic_font       Red Hat Mono Medium Italic
bold_italic_font  Red Hat Mono SemiBold Italic
font_size         11.0

# Fallback symbol/emoji coverage (the Noto fonts we installed earlier)
symbol_map U+1F300-U+1FAFF,U+2600-U+27BF,U+1F000-U+1F2FF Noto Color Emoji
symbol_map U+2000-U+2BFF Noto Sans Symbols 2

# --- Colors: Workshop palette ---
foreground            #e9dcc1
background            #0f0e0c
cursor                #c8102e
cursor_text_color     #0f0e0c
selection_foreground  #e9dcc1
selection_background  #2a2620

# Normal (palette 0-7)
color0  #0f0e0c
color1  #c8102e
color2  #8a9a5b
color3  #d9a441
color4  #6b8caf
color5  #a87ca0
color6  #7ea8a6
color7  #e9dcc1

# Bright (palette 8-15)
color8  #4a463e
color9  #e63950
color10 #a4b376
color11 #e9bd5e
color12 #8aa5c6
color13 #c19abd
color14 #9bc2c1
color15 #f5ecd6

# --- Window ---
window_padding_width  8 10
hide_window_decorations no
window_title_template "▮ {title}"
remember_window_size  yes

# --- Scrollback (the whole point) ---
# Kitty keeps full scrollback even when apps switch to the alternate screen.
# This is what Konsole does and what VTE refuses to do.
scrollback_lines              50000
scrollback_pager              less --chop-long-lines --RAW-CONTROL-CHARS +INFO
scrollback_pager_history_size 100
wheel_scroll_multiplier       3.0

# --- Mouse ---
copy_on_select        no
strip_trailing_spaces smart
mouse_hide_wait       3.0
url_color             #6b8caf
url_style             curly

# --- Tab bar ---
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_foreground   #0f0e0c
active_tab_background   #c8102e
inactive_tab_foreground #e9dcc1
inactive_tab_background #4a463e

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0.1

# --- Shell ---
shell /bin/bash
shell_integration enabled
